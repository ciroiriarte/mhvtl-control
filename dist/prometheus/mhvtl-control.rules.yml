# Example Prometheus alerting rules for mhvtl-control's /metrics.
# Adjust the job name, thresholds and durations to your site, then load the
# file with rule_files: in prometheus.yml. Check it with:
#   promtool check rules mhvtl-control.rules.yml
groups:
  - name: mhvtl-control
    rules:
      - alert: MhvtlControlDown
        expr: up{job="mhvtl-control"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "mhvtl-control on {{ $labels.instance }} cannot be scraped"

      - alert: MhvtlConfigUnreadable
        expr: mhvtl_config_ok == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "device.conf on {{ $labels.instance }} is missing or does not parse"

      - alert: MhvtlLibraryDown
        expr: mhvtl_library_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Library {{ $labels.library }} on {{ $labels.instance }} does not answer READ ELEMENT STATUS"

      # A library stays busy only while a move holds its changer, and a move
      # times out after 5 minutes; busy for longer means moves are stuck back
      # to back and the library gauges are stale.
      - alert: MhvtlLibraryBusyTooLong
        expr: mhvtl_library_busy == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Library {{ $labels.library }} on {{ $labels.instance }} has been busy for 10 minutes; its gauges are stale"

      - alert: MhvtlMetricsStale
        expr: mhvtl_control_metrics_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "mhvtl-control on {{ $labels.instance }} has not finished a collection for over 5 minutes"

      - alert: MhvtlHomeFilesystemFilling
        expr: |
          1 - mhvtl_home_filesystem_avail_bytes / mhvtl_home_filesystem_size_bytes > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Media home {{ $labels.home }} on {{ $labels.instance }} is over 90% full"

      - alert: MhvtlRawMediaAbsent
        expr: mhvtl_media_raw_absent_cartridges > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} raw-disk cartridge(s) in {{ $labels.home }} have no disk attached"

      - alert: MhvtlUnreadableMedia
        expr: mhvtl_media_unreadable_cartridges > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} cartridge(s) in {{ $labels.home }} have unreadable metadata"

      # A running library holds a file-backed cartridge with no media, or
      # without one of the files vtltape opens: a drive cannot load it, or
      # cannot read one of its partitions. One with no directory that
      # library_contents lists in a slot is created blank at the next
      # library start, so restore it before restarting the library.
      - alert: MhvtlMissingMedia
        expr: mhvtl_media_missing_cartridges{reason=~"directory_absent|file_absent"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Library {{ $labels.library }} on {{ $labels.instance }} holds {{ $value }} cartridge(s) with missing or incomplete media ({{ $labels.reason }})"

      - alert: MhvtlNoFreeSlots
        expr: mhvtl_library_slots_full == mhvtl_library_slots and mhvtl_library_slots > 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Every storage slot of library {{ $labels.library }} is full"
