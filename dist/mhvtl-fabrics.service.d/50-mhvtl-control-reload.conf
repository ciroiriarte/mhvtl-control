# Installed by mhvtl-control. Lets the configuration API apply an edited
# fabrics.conf with systemctl reload: mhvtl-fabrics apply reconciles the
# targets in place, so sessions to targets the edit leaves unchanged
# survive, where a restart runs ExecStopPost=mhvtl-fabrics remove first and
# drops them all. A reload is bounded by the unit's TimeoutStartSec
# (systemd.service(5)). The empty assignment resets the list first, so the
# command runs once even when mhVTL's own unit gains the same ExecReload
# (proposed upstream); this file can go once it has. See
# https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html#ExecReload=
# Without mhvtl-fabrics.service installed this does nothing.
# The path is the packaged /usr/bin/mhvtl-fabrics (mhVTL's default
# PREFIX=/usr, BIN_PATH in
# https://github.com/markh794/mhvtl/blob/19b71bd98d8ac2371db1e23a4af8dc17e3b089f3/config.mk#L122).
# A source install under another PREFIX, such as /usr/local, needs a drop-in
# of its own naming that mhvtl-fabrics.
[Service]
ExecReload=
ExecReload=/usr/bin/mhvtl-fabrics apply
