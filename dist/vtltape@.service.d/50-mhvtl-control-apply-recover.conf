# Installed by mhvtl-control. Orders mhVTL's instances after the recovery of
# an interrupted configuration apply, so none starts on half-written files.
# Ordering only, no Wants=: a pull-in would run the recovery on every
# instance start, including the apply helper's own starts while its intent
# journal exists. Without mhvtl-control-apply-recover.service enabled this
# does nothing. See systemd.unit(5), "Before=, After=":
# https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html#Before=
[Unit]
After=mhvtl-control-apply-recover.service
