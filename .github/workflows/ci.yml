name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The cross-language tests (queue frame layout, raw-disk superblock CRC)
      # compile against mhVTL's headers, and the config round-trip corpus is
      # checked against what mhVTL's etc/ generates; without it they skip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: markh794/mhvtl
          # The commit the upstream citations and the personality tables
          # are checked against; a bump PR moves it with them.
          ref: d65d25f350f66bbb8e9d572a0cb718f3052ec7da
          path: mhvtl-src
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # standard library only: nothing to cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        env:
          MHVTL_SRC: ${{ github.workspace }}/mhvtl-src
        shell: bash
        # Fail if a cross-language test skipped for want of mhVTL or cc: in CI
        # they must run.
        run: |
          go test -race -v ./... 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" = 0
          if grep -E 'submodule not found|header not available|cc not (found|available)' test.log; then
            echo "::error::cross-language tests skipped"; exit 1
          fi
      - name: dashboard tests
        run: node --test internal/webui/jstest
      - name: build
        run: make build
