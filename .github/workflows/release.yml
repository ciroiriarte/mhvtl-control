name: release

# Pushing a v<version> tag builds static binaries and packages and attaches
# them to a GitHub release for that tag. The tag must match the version in
# debian/changelog, rpm/mhvtl-control.spec and dist/mhvtl-control.8. Once the
# release is published, the obs job rebuilds the OBS packages from the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: tag matches the packaging versions
        run: |
          v=${GITHUB_REF_NAME#v}
          deb=$(sed -nE '1s/^mhvtl-control \(([^)]*)-[^-)]*\).*/\1/p' debian/changelog)
          rpm=$(sed -n 's/^Version:[[:space:]]*//p' rpm/mhvtl-control.spec)
          man=$(sed -nE '1s/.*"mhvtl-control ([^"]*)".*/\1/p' dist/mhvtl-control.8)
          echo "tag $v, debian $deb, rpm $rpm, man $man"
          for got in "$deb" "$rpm" "$man"; do
            [ "$got" = "$v" ] || { echo "::error::version mismatch: $got != $v"; exit 1; }
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...

  binaries:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build
        run: |
          v=${{ needs.check.outputs.version }}
          GOARCH=${{ matrix.arch }} make build VERSION=$v
          d=mhvtl-control-$v-linux-${{ matrix.arch }}
          mkdir $d && cp bin/mhvtl-control LICENSE README.md dist/mhvtl-control.service dist/mhvtl-control.env dist/mhvtl-control.tmpfiles dist/mhvtl-control.8 $d/
          tar -czf $d.tar.gz $d
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: mhvtl-control-*.tar.gz

  deb:
    needs: check
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: |
          apt-get update -qq
          # debian/control's Build-Depends, plus build-essential and lintian.
          apt-get install -y -qq --no-install-recommends build-essential debhelper golang-go pkgconf systemd-dev lintian
          dpkg-buildpackage -b -us -uc
          lintian --fail-on error ../*.changes
          mkdir out && cp ../mhvtl-control_*.deb out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.runner }}
          path: out/*.deb

  rpm:
    needs: check
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ['rockylinux/rockylinux:9', 'registry.opensuse.org/opensuse/leap:16.0']
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      # tar and gzip first: without git, checkout unpacks a tarball.
      - name: build tools
        run: |
          if command -v zypper >/dev/null; then
            zypper -n install rpm-build make go systemd-rpm-macros tar gzip
          else
            dnf -y install rpm-build make golang systemd-rpm-macros tar gzip
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: |
          v=${{ needs.check.outputs.version }}
          top=$PWD/rpmbuild
          mkdir -p $top/SOURCES
          tar --exclude=./rpmbuild --exclude=./.git --transform "s,^\.,mhvtl-control-$v," -czf $top/SOURCES/mhvtl-control-$v.tar.gz .
          rpmbuild -bb --define "_topdir $top" rpm/mhvtl-control.spec
          mkdir out && cp $top/RPMS/*/mhvtl-control-*.rpm out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-${{ strategy.job-index }}
          path: out/*.rpm

  release:
    needs: [check, binaries, deb, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "mhvtl-control ${GITHUB_REF_NAME#v}" --generate-notes

  # The OBS package home:ciriarte:mhvtl/mhvtl-control runs its services on the
  # server: tar_scm fetches branch obs-release and versions it from the tag it
  # points at. This job moves obs-release to the released commit and triggers
  # those services with OBS_TOKEN, a token that can only run this package's
  # services (osc token --create --operation runservice home:ciriarte:mhvtl
  # mhvtl-control). Without the secret (a fork) the job does nothing.
  obs:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: move obs-release to the tag
        env:
          GH_TOKEN: ${{ github.token }}
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          [ -n "$OBS_TOKEN" ] || { echo "::notice::OBS_TOKEN is not set: OBS not updated"; exit 0; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/obs-release" -f sha="$GITHUB_SHA" -F force=true >/dev/null ||
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/obs-release -f sha="$GITHUB_SHA" >/dev/null
      - name: trigger the OBS services
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          [ -n "$OBS_TOKEN" ] || exit 0
          # A token created for one package names it, so the request does not
          # ("Authorization token", OBS User Guide:
          # https://openbuildservice.org/help/manuals/obs-user-guide/cha-obs-authorization-token).
          curl -fsS -X POST -H "Authorization: Token $OBS_TOKEN" https://api.opensuse.org/trigger/runservice
